  - sort: 100000
    name: The Psion
    type: class
    _id: iVKn7ZQseEVy3eoX
    system:
      item: Compendium.ua2025-the-psion.classes.Item.psionBaseClass00
      description:
        value: >-
          <img
          src="modules/ua2025-the-psion/assets/art/psion_header.jpg"><p>Psions
          weave magic and extraordinary powers through the power of their minds.
          They develop their minds as fonts of power that manifest spells and
          grow stronger over the course of their adventuring careers. You can
          find everything you need to play one of these psionic powerhouses in
          the next few sections.</p>
        additionalHitPoints: ''
        additionalTraits: ''
        additionalEquipment: ''
        subclass: >-
          <p>A Psion subclass is a specialization that grants you features at
          certain Psion levels, as specified in the subclass. This section
          presents the
          @UUID[Compendium.ua2025-the-psion.content.JournalEntry.uaPsionClassDocs.JournalEntryPage.iVKn7ZQseEVy3eoX#metamorph]{Metamorph},
          @UUID[Compendium.ua2025-the-psion.content.JournalEntry.uaPsionClassDocs.JournalEntryPage.iVKn7ZQseEVy3eoX#psi-warper]{Psi
          Warper},
          @UUID[Compendium.ua2025-the-psion.content.JournalEntry.uaPsionClassDocs.JournalEntryPage.iVKn7ZQseEVy3eoX#psykinetic]{Psykinetic},
          and
          @UUID[Compendium.ua2025-the-psion.content.JournalEntry.uaPsionClassDocs.JournalEntryPage.iVKn7ZQseEVy3eoX#telepath]{Telepath}
          subclasses.</p>
      subclassItems:
        - Compendium.ua2025-the-psion.classes.Item.psionSubMetamorp
        - Compendium.ua2025-the-psion.classes.Item.psionSubPsiWarpe
        - Compendium.ua2025-the-psion.classes.Item.psionSubPsykinet
        - Compendium.ua2025-the-psion.classes.Item.psionSubTelepath
