  description:
    value: >-
      <p>You gain the following benefits.</p><p><em><strong>Lightning
      Jolt.</strong></em> Once per turn when you cast a spell or hit with an
      attack roll and deal Bludgeoning, Piercing, Slashing, or Psychic damage,
      you can change the damage type to Lightning
      damage.</p><p><em><strong>Psionic Talent.</strong></em> You know the
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplShockingGr]{Shocking
      Grasp} cantrip. You also always have the
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplFogCloud00]{Fog
      Cloud} spell prepared. You can cast it once without a spell slot, and you
      regain the ability to cast it in that way when you finish a Long Rest. You
      can also cast it using any spell slots you have of the appropriate level.
      When you cast these spells, they require no Verbal or Material components,
      and Intelligence, Wisdom, or Charisma is your spellcasting ability for
      them (choose when you select this feat).</p><p>When you reach character
      level 3, you also always have the
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplGustofWind]{Gust
      of Wind} spell prepared and can cast it the same way.</p>
