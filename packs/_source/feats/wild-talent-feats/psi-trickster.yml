  description:
    value: >-
      <p>You gain the following benefits.</p><p><em><strong>Cunning
      Mind.</strong></em> When you make a Charisma (Deception or Persuasion)
      check, you gain a bonus equal to your Intelligence modifier (minimum bonus
      of +1). You can use this benefit a number of times equal to your
      Proficiency Bonus, and you regain all expended uses when you finish a Long
      Rest.</p><p><em><strong>Psionic Talent.</strong></em> You know the
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplMinorIllus]{Minor
      Illusion} cantrip. You also always have the
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplDisguiseSe]{Disguise
      Self} spell prepared. You can cast it once without a spell slot, and you
      regain the ability to cast it in that way when you finish a Long Rest. You
      can also cast it using any spell slots you have. When you cast these
      spells, they require no Verbal or Material components, and Intelligence,
      Wisdom, or Charisma is your spellcasting ability for them (choose when you
      select this feat).</p>
