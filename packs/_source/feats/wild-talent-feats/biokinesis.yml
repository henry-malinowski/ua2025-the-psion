  description:
    value: >-
      <p>You gain the following benefits.</p><p><em><strong>Bend Life
      Energy.</strong></em> When a spell you cast restores Hit Points to a
      creature, you can roll 1d4 and add the number rolled to the total Hit
      Points restored. You can use this benefit a number of times equal to your
      Proficiency Bonus, and you regain all expended uses when you finish a Long
      Rest.</p><p><em><strong>Psionic Talent.</strong></em> You know the
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplSparetheDy]{Spare
      the Dying} cantrip. You also always have the
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplHealingWor]{Healing
      Word} spell prepared. You can cast it once without a spell slot, and you
      regain the ability to cast it in that way when you finish a Long Rest. You
      can also cast it using any spell slots you have of the appropriate level.
      When you cast these spells, they require no Verbal or Material components,
      and Intelligence, Wisdom, or Charisma is your spellcasting ability for
      them (choose when you select this feat).</p><p>When you reach character
      level 3, you also always have the
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplArcaneVigo]{Arcane
      Vigor} spell prepared and can cast it the same way.</p>
