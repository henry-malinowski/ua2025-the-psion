  description:
    value: >-
      <p>You gain the following benefits.</p><p><em><strong>Ice
      Manipulation.</strong></em> Once per turn when you cast a spell or hit
      with an attack roll and deal Bludgeoning, Piercing, Slashing, or Psychic
      damage, you can change the damage type to Cold
      damage.</p><p><em><strong>Psionic Talent.</strong></em> You know the
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplRayofFrost]{Ray of
      Frost} cantrip. You also always have the
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplArmorofAga]{Armor
      of Agathys} and
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplIceKnife00]{Ice
      Knife} spells prepared. You can cast each spell once without a spell slot,
      and you regain the ability to cast it in that way when you finish a Long
      Rest. You can also cast these spells using any spell slots you have. When
      you cast these spells, they require no Verbal or Material components, and
      Intelligence, Wisdom, or Charisma is your spellcasting ability for them
      (choose when you select this feat).</p>
