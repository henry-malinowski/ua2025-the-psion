  description:
    value: >-
      <p>You gain the following benefits.</p><p><em><strong>Psi
      Boost.</strong></em> When you take the &amp;Reference[Dash] action, you
      can increase your Speed by 10 feet until the start of your next turn. You
      can do this a number of times equal to your Proficiency Bonus, and you
      regain all expended uses when you finish a Long
      Rest.</p><p><em><strong>Psionic Talent.</strong></em> You know the
      @UUID[Compendium.ua2025-the-psion.spells.Item.uapsplFlingTelep]{Telekinetic
      Fling} cantrip (included in this UA). You also always have the
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplThunderwav]{Thunderwave}
      spell prepared. You can cast it once without a spell slot, and you regain
      the ability to cast it in that way when you finish a Long Rest. You can
      also cast it using any spell slots you have. When you cast these spells,
      they require no Verbal components, and Intelligence, Wisdom, or Charisma
      is your spellcasting ability for them (choose when you select this
      feat).</p>
