  description:
    value: >-
      <p>You gain the following benefits.</p><p><em><strong>Emotional
      Sense.</strong></em> When you take the Influence action, you can give
      yourself Advantage on any ability check made as part of that action. You
      can use this benefit a number of times equal to your Proficiency Bonus,
      and you regain all expended uses when you finish a Long
      Rest.</p><p><em><strong>Psionic Talent.</strong></em> You always have the
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplCharmPerso]{Charm
      Person} spell prepared. You can cast it once without a spell slot, and you
      regain the ability to cast it in that way when you finish a Long Rest. You
      can also cast it using any spell slots you have of the appropriate level.
      When you cast the spell, it requires no Verbal components, and
      Intelligence, Wisdom, or Charisma is your spellcasting ability for this
      spell (choose when you select this feat).</p><p>When you reach character
      level 3, you also always have the
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplCalmEmotio]{Calm
      Emotions} spell prepared and can cast it the same way.</p>
