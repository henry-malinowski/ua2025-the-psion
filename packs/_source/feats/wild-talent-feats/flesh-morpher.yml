  description:
    value: >-
      <p>You gain the following benefits.</p><p><em><strong>Flexible
      Flesh.</strong></em> When you make a Dexterity (Acrobatics or Sleight of
      Hand) check, you gain a bonus equal to your Intelligence modifier (minimum
      of +1). You can use this benefit a number of times equal to your
      Proficiency Bonus, and you regain all expended uses when you finish a Long
      Rest.</p><p><em><strong>Psionic Talent.</strong></em> You always have the
      <em>@UUID[Compendium.dnd-players-handbook.spells.Item.phbsplLongstride]{Longstrider}</em>
      spell prepared. You can cast it once without a spell slot, and you regain
      the ability to cast it in that way when you finish a Long Rest. You can
      also cast it using any spell slots you have of the appropriate level. When
      you cast the spell, it requires no Verbal components, and Intelligence,
      Wisdom, or Charisma is your spellcasting ability for this spell (choose
      when you select this feat).</p><p>When you reach character level 3, you
      also always have the
      <em>@UUID[Compendium.dnd-players-handbook.spells.Item.phbsplAlterSelf0]{Alter
      Self}</em> spell prepared and can cast it the same way.</p>
