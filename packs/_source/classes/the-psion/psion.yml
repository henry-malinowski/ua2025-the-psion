system:
  description:
    value: >-
      <blockquote><p>A Master of Psionic Power</p></blockquote><h3>Core Psion
      Traits</h3><table class="core-class-traits"><tbody><tr><th
      scope="row"><p><strong>Primary
      Ability</strong></p></th><td><p>Intelligence</p></td></tr><tr><th
      scope="row"><p><strong>Hit Point Die</strong></p></th><td><p>D6 per Psion
      level</p></td></tr><tr><th scope="row"><p><strong>Saving Throw
      Proficiencies</strong></p></th><td><p>Intelligence and
      Wisdom</p></td></tr><tr><th scope="row"><p><strong>Skill
      Proficiencies</strong></p></th><td><p><em>Choose 2:</em>Arcana, Insight,
      Intimidation, Investigation, Medicine, Perception,
      Persuasion</p></td></tr><tr><th scope="row"><p><strong>Weapon
      Proficiencies</strong></p></th><td><p>Simple weapons</p></td></tr><tr><th
      scope="row"><p><strong>Armor
      Training</strong></p></th><td><p>None</p></td></tr><tr><th
      scope="row"><p><strong>Starting
      Equipment</strong></p></th><td><p><em>Choose A or B:</em> (A)
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbwepSpear00000]{Spear},
      2
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbwepDagger0000]{Daggers},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbwepLightCross]{Light
      Crossbow}, 20
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbamoBolts00000]{Bolts},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbagCaseCrossbo]{Case},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbagDungeoneers]{Dungeoneer's
      Pack}, and [[/award 6GP]]; or (B) [[/award
      50GP]]</p></td></tr></tbody></table><p>Psions weave magic and
      extraordinary powers through the power of their minds. They develop their
      minds as fonts of power that manifest spells and grow stronger over the
      course of their adventuring careers. You can find everything you need to
      play one of these psionic powerhouses in the next few
      sections.</p><p></p><h2>Becoming a Psion …</h2><h3>As a Level 1
      Character</h3><ul><li>Gain all the traits in the Core Psion Traits
      table.</li><li>Gain the Psion’s level 1 features, which are listed in the
      @UUID[Compendium.ua2025-the-psion.content.JournalEntry.uaPsionClassDocs.JournalEntryPage.iVKn7ZQseEVy3eoX#class-features]{Pison
      Features table}.</li></ul><h3>As a Multiclass Character</h3><ul><li>Gain
      the Hit Point Die from the Core Psion Traits table.</li><li>Gain the
      Psion’s level 1 features, which are listed in the
      @UUID[Compendium.ua2025-the-psion.content.JournalEntry.uaPsionClassDocs.JournalEntryPage.iVKn7ZQseEVy3eoX#class-features]{Psion
      Features table}. See the
      @UUID[Compendium.dnd-players-handbook.content.JournalEntry.phbCreatingAChar.JournalEntryPage.vcs4jfEKRxPCsgXm]{multiclassing
      rules} in the Player’s Handbook to determine your available spell slots,
      adding all your Psion levels.</li></ul><aside
      class="notable"><p><strong>What is a Psion</strong></p><p>Psions are
      spellcasters who use innate mental powers to gain extraordinary abilities
      and unleash the magic of their minds. Psions and their magic (sometimes
      called “psionics”) can trace their history back to the appendix of the
      first edition Player’s Handbook, and a psionics-using class first appeared
      in The Complete Psionics Handbook in 1991. Psionics have taken numerous
      forms in D&amp;D, from alternative magic systems to options that dovetail
      with other D&amp;D rules. In the fifth edition, psychic power is
      synonymous with magic, and the magic of the mind flavors numerous spells,
      monsters, and subclasses—like the Psi Warrior Fighter and the Aberrant
      Sorcery Sorcerer in the Player’s Handbook. In this edition, the Psion is a
      spellcaster who interfaces with magic and spellcasting similarly to other
      classes in the game.</p><p>This UA provides the Psion with unique twists
      to spellcasting using Psionic Energy Dice and the Psionic Spellcasting
      feature, carving out a space to make the Psion stand out from its
      spellcasting peers.</p></aside>
