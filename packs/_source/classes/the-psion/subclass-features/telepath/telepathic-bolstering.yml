  description:
    value: >-
      <p>You have telepathy out to 30 feet. When you or a creature you can see
      within range of your telepathy fails an ability check or misses with an
      attack roll, you can take a Reaction to expend one Psionic Energy Die,
      roll the die, and add the number rolled to the d20, potentially turning a
      failed check into a success or a miss into a hit. The Psionic Energy Die
      is expended only if the check succeeds or the attack hits.</p>
