  description:
    value: >-
      <p>At the start of your turn, you can expend one Psionic Energy Die to
      strengthen your mind and enter a fortified state. For the next 10 minutes,
      you have Resistance to Psychic damage; and whenever you make an
      Intelligence, Wisdom, or Charisma saving throw, you add a roll of your
      Psionic Energy Die to the save. Rolling the Psionic Energy Die doesn’t
      expend it. You can’t use this benefit if you have the Incapacitated
      condition.</p>
