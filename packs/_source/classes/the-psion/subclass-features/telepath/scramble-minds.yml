  description:
    value: >-
      <p>You can cast
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplConfusion0]{Confusion}
      without expending a spell slot by instead expending four Psionic Energy
      Dice. When you cast Confusion without a spell slot using this feature, you
      can modify the spell so that the radius of the spell’s Sphere becomes 30
      feet and you can choose one creature you can see in the spell’s area to
      automatically succeed on their saving throw against the spell.</p><p>In
      addition, when a creature under the effect of the spell starts its turn,
      you choose their behavior from
      @UUID[Compendium.dnd-players-handbook.tables.RollTable.phbsplConfusionB]{the
      table} for the turn instead of the creature rolling to determine its
      behavior.</p>
