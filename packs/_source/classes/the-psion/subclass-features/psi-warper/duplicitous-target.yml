  description:
    value: >-
      <p>When a creature you can see makes an attack roll against you, you can
      take a Reaction to expend one Psionic Energy Die and choose a willing
      creature you can see within 30 feet of yourself that doesn’t have the
      Incapacitated condition. You and the willing creature teleport, swapping
      places with each other. The creature then becomes the target of the attack
      roll.</p>
