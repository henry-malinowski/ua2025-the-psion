  description:
    value: >-
      <p>As a Magic action, you expend four Psionic Energy Dice and choose Huge
      or smaller creatures within 30 feet of yourself, up to a number of
      creatures equal to your Intelligence modifier (minimum of one creature).
      Each of the chosen creatures is teleported to an unoccupied space you can
      see within 150 feet of you. An unwilling creature that succeeds on a
      Wisdom saving throw against your spell save DC is unaffected.</p>
