  description:
    value: >-
      <p>When you cast
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplShield0000]{Shield}
      in response to being hit by an attack roll and cause the triggering attack
      to miss, you can expend one Psionic Energy Die to launch the force back at
      the attacker. The attacker makes a Dexterity saving throw. Roll one
      Psionic Energy Die. On a failed save, the attacker takes Force damage
      equal to the amount rolled plus your Intelligence modifier. On a
      successful save, the attacker takes half as much damage only. Whether the
      target fails or succeeds on the saving throw, you gain Temporary Hit
      Points equal to the amount of damage dealt.</p>
