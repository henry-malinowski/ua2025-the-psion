  description:
    value: >-
      <p>At the start of your turn, you can expend one Psionic Energy Die to
      enter a destructive state. For the next 10 minutes, you gain a
      &amp;Reference[Flying]{Fly} Speed of 20 feet and can hover, and when you
      cast a Psion spell that expends a spell slot, you can roll your Psionic
      Energy Die and add the number rolled to one damage roll of that spell.
      This roll doesn’t expend the Psionic Energy Die.</p>
