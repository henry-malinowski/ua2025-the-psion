  description:
    value: >-
      <p>When you cast
      @UUID[Compendium.ua2025-the-psion.spells.Item.uapsplCrushTelek]{Telekinetic
      Crush}, you can expend one Psionic Energy Die to modify the spell so that
      whether a creature fails or succeeds on the saving throw against the
      spell, its Speed is halved until the start of your next turn. In addition,
      you can roll the expended Psionic Energy Die and add the number rolled to
