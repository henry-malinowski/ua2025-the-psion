  description:
    value: >-
      <p>When you use your
      @UUID[Compendium.ua2025-the-psion.classes.Item.psionPower000000]{Telekinetic
      Propel}, you can roll 1d4 and use the number rolled instead of expending a
      Psionic Energy Die.</p><p>In addition, when a target fails the saving
      throw against your Telekinetic Propel, you can impose one of the following
      effects on that target.</p><p><em><strong>Boost.</strong></em> The
      target’s Speed increases by 10 feet until the start of your next
      turn.</p><p><em><strong>Disorient.</strong></em> The target can’t make
      Opportunity Attacks until the start of its next
      turn.</p><p><em><strong>Telekinetic Bolt.</strong></em> The target takes
      Force damage equal to the number rolled on the Psionic Energy Die.</p>
