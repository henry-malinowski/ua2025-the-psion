  description:
    value: >-
      <p>Your weapon becomes wreathed in negative energy, and you radiate
      life-mending psionic energy. When you hit a target with an attack roll
      using your
      @UUID[Compendium.ua2025-the-psion.classes.Item.psionOrganicWeap]{Organic
      Weapon}, roll one Psionic Energy Die. The target takes extra Necrotic
      damage equal to the number rolled. This roll doesn’t expend the
      die.</p><p>Alternatively, when you hit a creature with your Organic
      Weapon, you can instead expend one Psionic Energy Die and roll it. The
      target takes extra Necrotic damage equal to the roll, and each creature of
      your choice in a 30-foot Emanation originating from you regains Hit Points
      equal the number rolled plus your Intelligence modifier. Once you use this
      feature, you can’t do so again until the start of your next turn.</p>
