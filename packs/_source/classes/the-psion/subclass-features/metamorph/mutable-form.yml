  description:
    value: >-
      <p>As a Bonus Action, you can expend one Psionic Energy Die to psionically
      stretch your limbs for 1 minute. Roll the expended Psionic Energy Die and
      gain a number of Temporary Hit Points equal to the number rolled plus your
      Intelligence modifier (minimum of 1 Temporary Hit Point). In addition, you
      gain the following benefits while this feature is
      active.</p><p><em><strong>Reach.</strong></em> Your reach increases by 5
      feet.</p><p><em><strong>Speed.</strong></em> Your Speed increases by 5
      feet.</p><p><em><strong>Touch.</strong></em> When you cast a spell that
      has a range of Touch and a casting time of an action, you can make the
      spell’s range 10 feet.</p>
