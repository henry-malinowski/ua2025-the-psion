  description:
    value: >-
      <p>A blade made of bone springs from your forearm or extends from your
      hand. The blade counts as a Simple Melee weapon with the Finesse property,
      and it deals 1d8 Piercing damage on a hit. You have
      &amp;Reference[Advantage] on the attack roll you make with the blade if at
      least one of your allies is within 5 feet of the target and the ally
      doesn’t have the &amp;Reference[Incapacitated apply=false] condition.</p>
