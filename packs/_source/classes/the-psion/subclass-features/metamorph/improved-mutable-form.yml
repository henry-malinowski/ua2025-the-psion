  description:
    value: >-
      <p>When you use
      @UUID[Compendium.ua2025-the-psion.classes.Item.psionMutableForm]{Mutable
      Form}, the duration increases to 10 minutes and you gain one of the
      following benefits of your choice, the effects of which last until Mutable
      Form ends.</p><p><em><strong>Stony Epidermis.</strong></em> You have
      &amp;Reference[Advantage] on Constitution saving throws to maintain
      Concentration. In addition, choose one of the following damage types:
      Acid, Bludgeoning, Cold, Fire, Lightning, Piercing, Poison, Slashing, or
      Thunder. You gain &amp;Reference[damageresistance]{Resistance} to the
      chosen damage type.</p><p><em><strong>Superior Stride.</strong></em> While
      you aren’t wearing armor, you can take the &amp;Reference[Dash] action as
      a &amp;Reference[Bonus Action], and you have a Climb Speed and Swim Speed
      equal to your Speed.</p><p><em><strong>Unnatural
      Flexibility.</strong></em> You gain a +1 bonus to AC, and your body—along
      with any equipment you’re wearing or carrying—becomes pliable. You can
      move through any space as narrow as 1 inch, and you can spend 5 feet of
      movement to escape from nonmagical restraints or end the
      &amp;Reference[Grappled apply=false] condition.</p>
