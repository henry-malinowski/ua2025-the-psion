  description:
    value: >-
      <p>Your hand and forearm transform into a crossbow made of muscle and
      sinew that fires bolts of bile. The launcher counts as a Simple Ranged
      weapon with a normal range of 30 feet and a long range of 90 feet, and it
      deals [[/damage type=acid 1d6]] damage on a hit. Once on each of your
      turns when you hit a creature with an attack roll using the launcher, you
      can deal an extra [[/damage type=acid 1d6]] damage to the
      target.</p><section class="secret foundry-note"
      id="secret-Cw7IjatCy0vovSez"><p><strong>Foundry Note</strong></p><p>When
      you use this weapon, you can add 1d6 Acid damage to the situation damage
      of the first roll. There is also an additional damage activity included in
      this item.</p></section>
