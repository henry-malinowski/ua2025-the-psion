  description:
    value: >-
      <p>You learn further psionic techniques that are fueled by your Psionic
      Energy Dice. You gain two disciplines of your choice, such as
      @UUID[Compendium.ua2025-the-psion.classes.Item.psionExpandedAwa]{Expanded
      Awareness} and
      @UUID[Compendium.ua2025-the-psion.classes.Item.psionIdInsinuati]{Id
      Insinuation}. Disciplines are described in the
      “@UUID[Compendium.ua2025-the-psion.content.JournalEntry.uaPsionClassDocs.JournalEntryPage.GVieisk8o3M1B6s8]{Psionic
      Discipline Options}” section later in this class’s description.</p><p>You
      can use only one Discipline each turn and only once per turn unless
      otherwise noted in one of those options.</p><p>Whenever you gain a Psion
      level, you can replace one of your Psionic Discipline options with one you
      don’t know. You gain one additional option at Psion levels 5, 10, 13, and
      17.</p><section class="secret"
      id="secret-ryXiZ06ntjyLEnSq"><p><strong>Foundry Note</strong></p><p>These
      disciplines are granted automatically as you advance and can be switched
      once per Psion level.</p></section>
