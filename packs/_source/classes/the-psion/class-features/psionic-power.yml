  description:
    value: >-
      <p>You harbor a wellspring of psionic energy within yourself. This energy
      is represented by your Psionic Energy Dice. Your Psion level determines
      the die size and number of Psionic Energy Dice you have, as shown in the
      Energy Dice column of the Psion Features table.</p><p>Your Psionic Energy
      Dice are used to enhance or fuel certain Psion features. You start with
      two such features: Telekinetic Propel and Telepathic Connection, each of
      which is detailed below. Some of your powers expend the Psionic Energy
      Dice, as specified in a power’s description, and you can’t use a power if
      it requires you to use a die when all your Psionic Energy Dice are
      expended.</p><p>You regain one expended Psionic Energy Die when you finish
      a Short Rest, and you regain all of them when you finish a Long
      Rest.</p><p>Some features that use Psionic Energy Dice require your target
      to make a saving throw. The save DC equals the spell save DC from this
      class’s Spellcasting feature.</p><p><em><strong>Telekinetic
      Propel.</strong></em> As a &amp;Reference[Bonus Action], choose one Large
      or smaller creature other than you that you can see within 30 feet of
      yourself. When you do so, the target must succeed on a Strength saving
      throw or be moved 5 feet straight toward you or straight away from you.
      Alternatively, you can roll one Psionic Energy Die when you take this
      Bonus Action, and the distance moved is equal to [[/r 5 *
      @scale.psion.die.die]]{5 times the number rolled}. The die is expended
      only if the target fails the saving throw.</p><p><em><strong>Telepathic
      Connection.</strong></em> You have telepathy with a range of 30 feet. As a
      Bonus Action, you can roll one Psionic Energy Die. For the next hour, the
      range of your telepathy increases by a number of feet equal to [[/r 10 *
      @scale.psion.die.die]]{10 times the number rolled}. The first time you use
      this Bonus Action after each Long Rest, you don’t expend the Psionic
      Energy Die. All other times you use this feature, you expend the die.</p>
