name: Spellcasting
type: feat
folder: KWnFjJdpBGthKGPK
img: icons/magic/control/debuff-energy-hold-teal-blue.webp
system:
  description:
    value: >-
      <p>You have learned how to channel magical energy using the power of your
      mind. See the
      @UUID[Compendium.dnd-players-handbook.content.JournalEntry.phbSpells0000000.JournalEntryPage.mh3akteBDiLegqFK]{rules
      on spellcasting}. The information below details how you use those rules
      with Psion spells, which appear in the
      @UUID[Compendium.ua2025-the-psion.content.JournalEntry.uaPsionSpellList.JournalEntryPage.vXHK4WdDQJJl0e9i]{Psion
      spell list} later in the class’s
      description.</p><p><strong>Cantrips.</strong> You know two Psion cantrips
      of your choice.
      <em>@UUID[Compendium.dnd-players-handbook.spells.Item.phbsplMinorIllus]{Minor
      Illusion}</em> and
      <em>@UUID[Compendium.ua2025-the-psion.spells.Item.uapsplFlingTelep]{Telekinetic
      Fling}</em> are recommended.</p><p>Whenever you gain a Psion level, you
      can replace one of your cantrips from this feature with another Psion
      cantrip of your choice.</p><p>When you reach Psion levels 4 and 10, you
      learn another Psion cantrip of your choice, as shown in the Cantrips
      column of the Psion Features table.</p><p><strong>Spell Slots.</strong>
      The Psion Features table shows how many spell slots you have to cast your
      level 1+ spells. You regain all expended spell slots when you finish a
      &amp;Reference[Long Rest].</p><p><strong>Prepared Spells of Level
      1+.</strong> You prepare the list of level 1+ spells that are available
      for you to cast with this feature. To start, choose four level 1 Psion
      spells.
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplCharmPerso]{Charm
      Person},
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplCommand000]{Command},
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplDissonantW]{Dissonant
      Whispers}, and
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplMageArmor0]{Mage
      Armor} are recommended.</p><p>The number of spells on your list increases
      as you gain Psion levels, as shown in the Prepared Spells column of the
      @UUID[Compendium.ua2025-the-psion.content.JournalEntry.uaPsionClassDocs.JournalEntryPage.iVKn7ZQseEVy3eoX#class-features]{Psion
      Features table}. Whenever that number increases, choose additional Psion
      spells until the number of spells on your list matches the number in the
      table. The chosen spells must be of a level for which you have spell
      slots. For example, if you’re a level 3 Psion, your list of prepared
      spells can include six Psion spells of levels 1 and 2 in any
      combination.</p><p>If another Psion feature gives you spells that you
      always have prepared, those don’t count against the number of spells you
      can prepare with this feature, but those spells otherwise count as Psion
      spells for you.</p><p><strong>Changing Your Prepared Spells.
      </strong>Whenever you gain a Psion level, you can replace one spell on
      your list with another Psion spell of an eligible
      level.</p><p><strong>Spellcasting Ability. </strong>Intelligence is your
      spellcasting ability for your Psion spells.</p><p><strong>Psionic
      Spellcasting. </strong>When you cast a Psion spell, that spell doesn’t
      require a Verbal or Material component, even if the spell includes “V” or
      “M” in its “Components” entry, except Material components that are
      consumed by the spell or have a cost specified in the spell.</p>
