  description:
    value: >-
      <p>At the start of your turn, you can expend one Psionic Energy Die. Until
      the start of your next turn, you have Immunity to the
      &amp;Reference[Charmed apply=false] and &amp;Reference[Frightened
      apply=false] conditions and &amp;Reference[Advantage] on Intelligence
      saving throws. If you are Charmed or Frightened when you use this
      discipline, the condition ends on you.</p><p>When you use Psionic Guards,
      you can also use a different Psionic Discipline this turn.</p>
