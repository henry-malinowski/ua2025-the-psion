  description:
    value: >-
      <p>At the start of your turn, you can expend one Psionic Energy Die to
      hone your destructive psionics. Roll the die and record the number rolled.
      You gain the following benefits for 1 minute or until you have the
      Incapacitated condition.</p><p><em><strong>Bypassing
      Psionics.</strong></em> Damage from your weapon attacks, Psion spells, and
      Psion features ignores Resistance to Psychic
      damage.</p><p><em><strong>Attack Mode.</strong></em> Once per turn, when
      you deal Psychic damage to one or more creatures, you can replace the
      number rolled on one of the damage dice with the number recorded when you
      activated this Psionic Discipline.</p><p>When you use Sharpened Mind, you
      can also use a different Psionic Discipline this turn.</p>
