  description:
    value: >-
      <p>Immediately after a creature you can see hits you with an attack roll,
      you can take a &amp;Reference[Reaction] to expend one Psionic Energy Die,
      roll it, and reduce the damage you take from the attack equal to two times
      the number rolled plus your Intelligence modifier (minimum of two). In
      addition, you can force the attacker to make a Wisdom saving throw. On a
      failed save, the target takes Psychic damage equal to the amount of damage
      you reduced.</p>
