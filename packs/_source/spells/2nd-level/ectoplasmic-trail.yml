  description:
    value: >-
      <p>You cloak yourself in spirits that leave ectoplasm in your wake until
      the end of your turn. While cloaked, you can move through occupied spaces
      as if they were Difficult Terrain, and moving doesn’t provoke Opportunity
      Attacks. If you end your turn in such a space, you are returned to the
      last unoccupied space you were in.</p><p>While cloaked, whenever you enter
      the space of a creature, the creature becomes covered in ectoplasm until
      the end of your next turn. A creature covered in ectoplasm has its Speed
      reduced by 10 feet and takes [[/damage]] damage at the start of its turn.
      A creature can be covered in ectoplasm only once during a
      turn.</p><p><em><strong>Using a Higher-Level Spell Slot.</strong></em>
      While cloaked, your Speed increases by 10 feet for each spell slot level
      above 2.</p>
