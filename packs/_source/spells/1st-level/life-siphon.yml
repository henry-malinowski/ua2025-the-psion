  description:
    value: >-
      <p>You fire an orb of psionic energy fueled by your life force at a
      creature you can see within range. Make a ranged spell attack against the
      target. On a hit, the target takes 1d10 Psychic damage and you can expend
      one Hit Point Die to increase the damage by 1d10.</p><p><em><strong>Using
      a Higher-Level Spell Slot.</strong></em> The damage increases by 1d10 and
      the number of Hit Dice you can expend increases by one for each spell slot
      level above 1.</p><section class="secret"
      id="secret-89EYIN4GcUBd9Ypn"><p><strong>Foundry Note</strong></p><p>Due to
      technical limitations, expending hit dice must be done as a sperate
      activity. When using the <strong>Damage</strong> activity, select the
      level such that you are expending the number of hit die you wish to use.
      These should be considered the same instance of damage. This activity does
      not expend spellslots.</p></section>
