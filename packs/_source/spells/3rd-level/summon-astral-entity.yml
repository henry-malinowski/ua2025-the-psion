  description:
    value: >-
      <p>You call forth the spirit of a psionic entity. It manifests in an
      unoccupied space that you can see within range and uses the
      <strong>Psionic Spirit</strong> stat block. When you cast the spell,
      choose
      @UUID[Compendium.ua2025-the-psion.actors.Actor.psionSpiritCryst]{Crystal
      Entity},
      @UUID[Compendium.ua2025-the-psion.actors.Actor.psionSpiritEctop]{Ectoplasmic
      Entity}, or
      @UUID[Compendium.ua2025-the-psion.actors.Actor.psionSpiritGhost]{Ghostly
      Entity}. The creature resembles an astral entity of that kind, which
      determines certain details in its stat block. The creature disappears when
      it drops to 0 Hit Points or when the spell ends.</p><p>The creature is an
      ally to you and your allies. In combat, the creature shares your
      Initiative count, but it takes its turn immediately after yours. It obeys
      your verbal commands (no action required by you). If you don’t issue any,
      it takes the &amp;Reference[Dodge] action and uses its movement to avoid
      danger.</p><p><em><strong>Using a Higher-Level Spell Slot.</strong></em>
      Use the spell slot’s level for the spell’s level in the stat block.</p>
