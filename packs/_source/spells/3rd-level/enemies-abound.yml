  description:
    value: >-
      <p>Choose a creature you can see within range. The target must succeed on
      an [[/save]]{Intelligence saving throw} or have the
      &amp;Reference[Frightened] condition for the duration. While Frightened,
      the target loses the ability to distinguish friend from foe and is
      affected in the following ways:</p><ul><li><p>The target regards all
      creatures it can see as enemies.</p></li><li><p>Whenever the target
      chooses a creature other than itself for an attack, spell, or other
      ability, it must choose at random from among the creatures it can see
      within range of that attack, spell, or other ability.</p></li><li><p>The
      target must make an Opportunity Attack each time it is able
      to.</p></li></ul><p>Each time the target takes damage, it makes another
      [[/save]]{Intelligence saving throw}. On a successful save, the spell
      ends.</p>
