  description:
    value: >-
      <p>You create a field of crushing telekinetic force in a 30-foot Cube
      within range. Each creature in the area makes a [[/save]]{Strength saving
      throw}. On a failed save, a target takes [[/damage]] damage and has the
      &amp;Reference[Prone] condition. On a successful save, a target takes half
      as much damage only.</p><p><em><strong>Using a Higher-Level Spell
      Slot.</strong></em> The damage increases by 1d6 for each spell slot level
      above 3.</p>
