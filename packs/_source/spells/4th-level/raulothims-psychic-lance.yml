  description:
    value: >-
      <div class="rd__b  rd__b--3"><div data-roll-name-ancestor="At Higher
      Levels" class="rd__b  rd__b--3"><p>You unleash a shimmering lance of
      psychic power from your forehead at a creature that you can see within
      range. Alternatively, you can utter a creature’s name (a pseudonym, title,
      or nickname doesn’t work). If the named target is within range, it becomes
      the spell’s target even if you can’t see it. If the named target isn’t
      within range or you use an invalid name, the lance dissipates without
      effect.</p></div><p>The target must make an Intelligence saving throw. On
      a failed save, the target takes [[/damage 7d6 type=psychic]] damage and
      has the &amp;Reference[condition=incapacitated] condition until the start
      of your next turn. On a successful save, the target takes half as much
      damage only.</p><p><em><strong>Using a Higher-Level Spell
      Slot.</strong></em> The damage increases by [[/damage type=psychic 1d6]]
      for each spell slot level above 4.</p></div>
