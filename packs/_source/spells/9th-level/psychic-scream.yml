  description:
    value: >-
      <p>You unleash the power of your mind to blast the intellect of up to ten
      creatures of your choice that you can see within range. Creatures that
      have an Intelligence score of 2 or lower are unaffected.</p><p>Each target
      must make an Intelligence saving throw. On a failed save, a target takes
      [[/damage]] damage and has the &amp;Reference[Stunned] condition. On a
      successful save, a target takes half as much damage only. If the target is
      reduced to 0 Hit Points by this damage, its head explodes, assuming it has
      one.</p><p>At the end of each of its turns, the Stunned target repeats the
      save, ending the condition on itself on a success.</p>
