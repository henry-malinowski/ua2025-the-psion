  description:
    value: >-
      <p>You unleash a concussive burst of psionic energy. Each creature in a
      60-foot Cone originating from you makes an [[/save]]{Intelligence saving
      throw}. On a failed save, the creature takes [[/damage]] damage and has
      the &amp;Reference[Stunned] condition until the start of your next turn.
      On a successful save, the creature takes half as much damage
      only.</p><p><em><strong>Using a Higher-Level Spell Slot.</strong></em> The
      damage increases by 1d8 for each spell slot level above 6.</p>
